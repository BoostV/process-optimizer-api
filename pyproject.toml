[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process-optimizer-api"
version = "1.0.0"
description = "REST based API for ProcessOptimizer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "BoostV"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "connexion[swagger-ui]==2.14.2",
    "python-keycloak==2.13.2",
    "Flask==2.2.3",
    "Flask-Cors==3.0.10",
    "ProcessOptimizer==1.0.2",
    "json-tricks==3.15.5",
    "jsonschema==4.15.0",
    "cryptography==3.4.7",
    "waitress==2.1.2",
    "rq==2.0.0",
    # ProcessOptimizer requirements
    "numpy==1.23.3",
    "matplotlib==3.5.3",
    "scipy==1.9.1",
    "bokeh==2.4.3",
    "scikit-learn==1.1.2",
    "six==1.16.0",
    "deap==1.3.3",
    "pyYAML==6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-watch==4.2.0",
]

[project.urls]
Homepage = "https://github.com/BoostV/process-optimizer-api"
Repository = "https://github.com/BoostV/process-optimizer-api"
Issues = "https://github.com/BoostV/process-optimizer-api/issues"

[tool.setuptools.packages.find]
include = ["optimizerapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
